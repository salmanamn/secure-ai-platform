apiVersion: v1
kind: Pod
metadata:
  name: check-over-quota
  namespace: triage
  annotations:
    test.platform.lab/expect: "exceeded quota: platform-quota.*requests.cpu"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: mcr.microsoft.com/azurelinux/base/python:3.12.16-2-azl3.0.20261120
      command: ["python3", "-c", "pass"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 1500m
          memory: 64Mi
        limits:
          memory: 128Mi
