# One namespace per workload the platform hosts (D3). Each passes platform-tenant-namespace: owner labels and Pod
# Security "restricted" for enforce, warn and audit (D7). Quotas, RBAC and network policies come in M2.
apiVersion: v1
kind: Namespace
metadata:
  name: triage
  labels:
    platform.lab/tenant: triage
    platform.lab/owner: salmanamn
    platform.lab/source: ticket-triage-agent
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: voice
  labels:
    platform.lab/tenant: voice
    platform.lab/owner: salmanamn
    platform.lab/source: arabic-voice-assistant
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: meetings
  labels:
    platform.lab/tenant: meetings
    platform.lab/owner: salmanamn
    platform.lab/source: meeting-summarizer
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
