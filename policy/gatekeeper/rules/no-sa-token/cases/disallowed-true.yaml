apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-token-true
  namespace: triage
  annotations:
    test.platform.lab/expect: "Deployment <case-token-true> must set"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: case-token-true
  template:
    metadata:
      labels:
        app: case-token-true
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/salmanamn/voice-gateway:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
