apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: case-rb-cluster-admin
  namespace: triage
  annotations:
    test.platform.lab/expect: "roleRef ClusterRole cluster-admin is not one of the ClusterRoles"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tenant:triage:admins
