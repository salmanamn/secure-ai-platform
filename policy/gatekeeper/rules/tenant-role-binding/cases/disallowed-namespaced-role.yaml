apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: case-rb-role
  namespace: triage
  annotations:
    test.platform.lab/expect: "roleRef Role anything is not one of the ClusterRoles"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: anything
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: tenant:triage:admins
