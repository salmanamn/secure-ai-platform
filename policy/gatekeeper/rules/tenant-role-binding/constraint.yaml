apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformTenantRoleBinding
metadata:
  name: platform-tenant-role-binding
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [rbac.authorization.k8s.io]
        kinds: [RoleBinding]
    excludedNamespaces:
      - default
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - keda # KEDA, the platform's autoscaler (D22)
  parameters:
    allowedClusterRoles:
      - platform-tenant-admin
      - platform-tenant-reader
