apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformTenantNamespace
metadata:
  name: platform-tenant-namespace
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Namespace]
  parameters:
    platformNamespaces:
      - default
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - keda # KEDA, the platform's autoscaler (D22)
