apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformContainerResources
metadata:
  name: platform-container-resources
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: [Pod]
      - apiGroups: [apps]
        kinds: [Deployment, StatefulSet, DaemonSet, ReplicaSet]
      - apiGroups: [batch]
        kinds: [Job, CronJob]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - keda # KEDA, the platform's autoscaler (D22)
