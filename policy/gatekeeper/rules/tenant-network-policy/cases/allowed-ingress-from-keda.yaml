apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-np-from-keda
  namespace: triage
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: http
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keda-operator
      ports: [{ protocol: TCP, port: 8080 }]
