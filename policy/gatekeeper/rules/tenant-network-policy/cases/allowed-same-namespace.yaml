apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-np-same-namespace
  namespace: triage
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: db
      ports: [{ protocol: TCP, port: 5432 }]
