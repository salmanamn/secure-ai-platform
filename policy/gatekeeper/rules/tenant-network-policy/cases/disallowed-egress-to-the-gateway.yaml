# The docker network's gateway is the laptop's whole Docker host, every published port (D23): not a tenant range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-np-gateway
  namespace: triage
  annotations:
    test.platform.lab/expect: "is not this tenant's pods, an allowed namespace"
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.58.1/32
