apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-np-from-addresses
  namespace: triage
  annotations:
    test.platform.lab/expect: "ingress only from pods of namespace <triage>"
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
