apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: case-np-to-voice
  namespace: triage
  annotations:
    test.platform.lab/expect: "is not this tenant's pods, an allowed namespace"
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: voice
