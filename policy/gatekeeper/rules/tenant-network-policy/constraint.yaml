apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPlatformTenantNetworkPolicy
metadata:
  name: platform-tenant-network-policy
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [networking.k8s.io]
        kinds: [NetworkPolicy]
    excludedNamespaces:
      - default
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system
      - keda # KEDA, the platform's autoscaler (D22)
  parameters:
    ingressNamespaces:
      - keda # KEDA's operator polls a tenant's scaling endpoint (D24)
    egressNamespaces:
      - kube-system
    egressCIDRs:
      triage:
        - 192.168.58.96/28 # Project 3's emulators on minikube's docker network, .101-.104 (D23)
