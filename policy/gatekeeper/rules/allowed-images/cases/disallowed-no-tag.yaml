apiVersion: v1
kind: Pod
metadata:
  name: case-image-no-tag
  namespace: triage
  annotations:
    test.platform.lab/expect: "names no version"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/salmanamn/app
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 128Mi
