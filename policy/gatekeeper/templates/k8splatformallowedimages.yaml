# Generated by scripts/build_policy.py from policy/gatekeeper/rules/allowed-images: don't edit by hand.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8splatformallowedimages
  annotations:
    metadata.gatekeeper.sh/title: Images from the platform's registries, by tag or digest
    description: 'Every container image (init and ephemeral ones included) starts with one of the allowed registry prefixes and names a version: a digest, or a tag that is not "latest". A prefix ends with "/", so "ghcr.io/salmanamn/" does not admit "ghcr.io/salmanamnx/" (D6).'
spec:
  crd:
    spec:
      names:
        kind: K8sPlatformAllowedImages
      validation:
        openAPIV3Schema:
          type: object
          properties:
            registries:
              type: array
              description: Allowed image prefixes, each ending with "/".
              items:
                type: string
                pattern: /$
  targets:
  - target: admission.k8s.gatekeeper.sh
    rego: |-
      package k8splatformallowedimages

      import data.lib.workload
      import future.keywords.contains
      import future.keywords.if
      import future.keywords.in

      violation contains {"msg": msg} if {
          some c in workload.all_containers
          not allowed_registry(c.image)
          msg := sprintf("container <%v> image <%v> is not from an allowed registry: %v", [c.name, c.image, input.parameters.registries])
      }

      violation contains {"msg": msg} if {
          some c in workload.all_containers
          not pinned(c.image)
          msg := sprintf("container <%v> image <%v> names no version: use a digest or a tag other than latest", [c.name, c.image])
      }

      allowed_registry(image) if {
          some prefix in input.parameters.registries
          startswith(image, prefix)
      }

      pinned(image) if contains(last_segment(image), "@sha256:")

      pinned(image) if {
          tag := image_tag(image)
          tag != ""
      }

      # The part after the last "/": a registry port ("localhost:5000/app") is never read as a tag.
      last_segment(image) := s if {
          parts := split(image, "/")
          s := parts[count(parts) - 1]
      }

      image_tag(image) := tag if {
          segment := last_segment(image)
          not contains(segment, "@")
          parts := split(segment, ":")
          count(parts) == 2
          tag := parts[1]
      }
    libs:
    - |-
      package lib.workload

      # The pod spec of the object under review, for every kind that makes pods. A Deployment is judged when it is applied,
      # not later, when its ReplicaSet fails to create pods where nobody is looking (D4).

      import future.keywords.contains
      import future.keywords.if
      import future.keywords.in

      template_kinds := {"Deployment", "StatefulSet", "DaemonSet", "ReplicaSet", "Job"}

      obj := input.review.object

      pod_spec := obj.spec if obj.kind == "Pod"

      pod_spec := obj.spec.template.spec if obj.kind in template_kinds

      pod_spec := obj.spec.jobTemplate.spec.template.spec if obj.kind == "CronJob"

      # Containers that run the workload: they can set resources.
      containers contains c if {
          some c in pod_spec.containers
      }

      containers contains c if {
          some c in pod_spec.initContainers
      }

      # Every container, including the ephemeral ones `kubectl debug` adds: they run images too.
      all_containers contains c if {
          some c in containers
      }

      all_containers contains c if {
          some c in pod_spec.ephemeralContainers
      }
